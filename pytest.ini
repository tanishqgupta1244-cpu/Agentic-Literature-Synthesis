[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode for async tests
asyncio_mode = auto

# Output verbosity
addopts =
    --verbose
    --tb=short
    --strict-markers

# Custom markers
markers =
    unit: Fast, isolated unit tests with no external dependencies
    integration: Tests that require a running database or external service
    slow: Tests that take more than a few seconds

# Ignore directories
norecursedirs =
    .git
    .venv
    venv
    node_modules
    .next
    __pycache__
    dist
    build
